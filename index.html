
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rangana &amp; Umayangana | Wedding Invitation</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Wedding invitation of Rangana and Umayangana.">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #fff;
}

body {
    overflow-x: hidden;
}

.invitation, .page {
    width: 100%;
    margin: 0;
    padding: 0;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
}

/* Mobile devices */
@media (max-width: 600px) {
    .page img {
        width: 100%;
        height: auto;
    }
}

/* Print */
@media print {
    @page {
        margin: 0;
    }

    .page {
        break-after: page;
        page-break-after: always;
    }

    .page:last-child {
        break-after: auto;
        page-break-after: auto;
    }
}
</style>
</head>

<body>
<main class="invitation">

<section class="page">
<img src="/Uma-01.jpg"
     alt="Wedding invitation cover"
     width="1200" height="1800"
     fetchpriority="high"
     loading="eager">
</section>

<section class="page">
<img src="/Uma-02.jpg"
     alt="Wedding invitation message"
     loading="lazy">
</section>

<section class="page">
<img src="/Uma-03.jpg"
     alt="Wedding date and venue"
     loading="lazy">
</section>

<section class="page">
<img src="/Uma-04.jpg"
     alt="Wedding blessings"
     loading="lazy">
</section>

<section class="page">
<img src="/Uma-05.jpg"
     alt="Wedding invitation final page"
     loading="lazy">
</section>

</main>
</body>
</html>
