<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rangana &amp; Umayangana | Wedding Invitation</title>

    <meta name="description"
          content="View the wedding invitation of Rangana and Umayangana.">

    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="index, follow">

    <style>
        /* Reset */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #f4f0eb;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        .invitation {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            padding: 24px;
        }

        .page {
            position: relative;
            width: 100%;
            margin: 0 auto 24px;
            background: #fff;
            overflow: hidden;
        }

        .page img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            object-fit: contain;
            border: 0;
        }

        /* Image loading error message */
        .image-error {
            padding: 24px 16px;
            color: #8a2525;
            font: 16px/1.5 Arial, sans-serif;
            text-align: center;
            overflow-wrap: anywhere;
        }

        [hidden] {
            display: none !important;
        }

        /* Tablet */
        @media (max-width: 1024px) {
            .invitation {
                padding: 16px;
            }

            .page {
                margin-bottom: 16px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                background: #fff;
            }

            .invitation {
                width: 100%;
                max-width: none;
                padding: 0;
            }

            .page {
                width: 100%;
                margin: 0 0 6px;
            }
        }

        /* Print */
        @media print {
            @page {
                size: auto;
                margin: 0;
            }

            body {
                background: #fff;
            }

            .invitation {
                width: 100%;
                max-width: none;
                padding: 0;
            }

            .page {
                margin: 0;
                overflow: visible;
                break-after: page;
                page-break-after: always;
            }

            .page:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .page img {
                width: 100%;
                height: auto;
            }

            .image-error {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="invitation">

        <section class="page">
            <img src="./Uma-01.jpg"
                 alt="Rangana and Umayangana wedding invitation cover"
                 fetchpriority="high">
            <p class="image-error" hidden></p>
        </section>

        <section class="page">
            <img src="./Uma-02.jpg"
                 alt="Wedding invitation message"
                 loading="eager">
            <p class="image-error" hidden></p>
        </section>

        <section class="page">
            <img src="./Uma-03.jpg"
                 alt="Wedding date, time and venue details"
                 loading="eager">
            <p class="image-error" hidden></p>
        </section>

        <section class="page">
            <img src="./Uma-04.jpg"
                 alt="Wedding words of blessing"
                 loading="eager">
            <p class="image-error" hidden></p>
        </section>

        <section class="page">
            <img src="./Uma-05.jpg"
                 alt="Wedding invitation final page"
                 loading="eager">
            <p class="image-error" hidden></p>
        </section>

    </main>

    <script>
        document.querySelectorAll(".page img").forEach(function (img) {
            img.addEventListener("error", function () {
                const message = img.parentElement.querySelector(
                    ".image-error"
                );

                message.textContent =
                    "This invitation image could not be loaded. " +
                    "Please check the image filename and hosting path.";

                message.hidden = false;
                img.hidden = true;
            });
        });
    </script>
</body>
</html>
