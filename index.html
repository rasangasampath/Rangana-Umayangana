
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangana & Umayangana | Wedding Invitation</title>
<meta name="theme-color" content="#ffffff">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #fff;
}

body {
    overflow-x: hidden;
}

.invitation {
    width: 100%;
    margin: 0;
    padding: 0;
}

.page {
    width: 100%;
    margin: 0;
    padding: 0;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
}

.error {
    padding: 15px;
    text-align: center;
    color: #b00020;
    font: 14px Arial, sans-serif;
    overflow-wrap: anywhere;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>
<main class="invitation">

    <section class="page">
        <img src="/Uma-01.jpg"
             alt="Wedding invitation cover"
             fetchpriority="high">
        <p class="error" hidden></p>
    </section>

    <section class="page">
        <img src="/Uma-02.jpg"
             alt="Wedding invitation message"
             loading="lazy">
        <p class="error" hidden></p>
    </section>

    <section class="page">
        <img src="/Uma-03.jpg"
             alt="Wedding date and venue"
             loading="lazy">
        <p class="error" hidden></p>
    </section>

    <section class="page">
        <img src="/Uma-04.jpg"
             alt="Wedding blessings"
             loading="lazy">
        <p class="error" hidden></p>
    </section>

    <section class="page">
        <img src="/Uma-05.jpg"
             alt="Wedding invitation final page"
             loading="lazy">
        <p class="error" hidden></p>
    </section>

</main>

<script>
document.querySelectorAll(".page img").forEach(function(img) {
    img.addEventListener("error", function() {
        const error = img.parentElement.querySelector(".error");
        error.textContent =
            "Image not found: " + img.getAttribute("src") +
            ". Check the filename and deployment.";
        error.hidden = false;
        img.hidden = true;
    });
});
</script>

</body>
</html>
