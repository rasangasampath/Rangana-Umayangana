
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Rangana &amp; Umayangana | Wedding Invitation</title>

<meta name="description" content="Wedding invitation of Rangana and Umayangana.">
<meta name="theme-color" content="#ffffff">

<style>
*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
}

body {
    overflow-x: hidden;
    font-family: Georgia, "Times New Roman", serif;
}

.invitation {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
}

.page {
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

.page img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
}

@media (max-width: 600px) {
    html,
    body,
    .invitation,
    .page {
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .page img {
        width: 100%;
        height: auto;
    }
}

@media print {
    @page {
        margin: 0;
        size: auto;
    }

    .page {
        break-after: page;
        page-break-after: always;
    }

    .page:last-child {
        break-after: auto;
        page-break-after: auto;
    }
}
</style>
</head>

<body>

<main class="invitation">

    <section class="page">
        <img src="/Uma-01.jpg"
             alt="Rangana and Umayangana wedding invitation cover"
             fetchpriority="high">
    </section>

    <section class="page">
        <img src="/Uma-02.jpg"
             alt="Wedding invitation message"
             loading="lazy">
    </section>

    <section class="page">
        <img src="/Uma-03.jpg"
             alt="Wedding date, time and venue"
             loading="lazy">
    </section>

    <section class="page">
        <img src="/Uma-04.jpg"
             alt="Wedding words of blessing"
             loading="lazy">
    </section>

    <section class="page">
        <img src="/Uma-05.jpg"
             alt="Wedding invitation final page"
             loading="lazy">
    </section>

</main>

</body>
</html>
