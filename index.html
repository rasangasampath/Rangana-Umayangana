
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangana &amp; Umayangana | Wedding Invitation</title>
<meta name="theme-color" content="#ffffff">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #fff;
}

body {
    overflow-x: hidden;
}

.invitation, .page {
    width: 100%;
    margin: 0;
    padding: 0;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
    margin: 0;
    padding: 0;
}

/* Print */
@media print {
    @page {
        margin: 0;
    }

    .page {
        break-after: page;
    }

    .page:last-child {
        break-after: auto;
    }
}
</style>
</head>

<body>
<main class="invitation">

<section class="page">
<img src="/Uma-01.jpg"
     alt="Wedding invitation cover"
     loading="eager"
     fetchpriority="high"
     decoding="async">
</section>

<section class="page">
<img src="/Uma-02.jpg"
     alt="Wedding invitation page 2"
     loading="lazy"
     decoding="async">
</section>

<section class="page">
<img src="/Uma-03.jpg"
     alt="Wedding invitation page 3"
     loading="lazy"
     decoding="async">
</section>

<section class="page">
<img src="/Uma-04.jpg"
     alt="Wedding invitation page 4"
     loading="lazy"
     decoding="async">
</section>

<section class="page">
<img src="/Uma-05.jpg"
     alt="Wedding invitation page 5"
     loading="lazy"
     decoding="async">
</section>

</main>
</body>
</html>
