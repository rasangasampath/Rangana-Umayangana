
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Rangana &amp; Umayangana | Wedding Invitation</title>

    <meta name="description"
          content="View the wedding invitation of Rangana and Umayangana.">
    <meta name="theme-color" content="#ffffff">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #f4f0eb;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        .invitation {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            padding: 24px;
        }

        .page {
            width: 100%;
            margin: 0 auto 24px;
            background: #ffffff;
            overflow: hidden;
        }

        .page img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            border: 0;
        }

        .image-error {
            padding: 24px 16px;
            color: #a00000;
            font: 15px/1.6 Arial, sans-serif;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .image-error a {
            color: #0645ad;
            overflow-wrap: anywhere;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 1024px) {
            .invitation {
                padding: 12px;
            }

            .page {
                margin-bottom: 12px;
            }
        }

        @media (max-width: 600px) {
            body {
                background: #ffffff;
            }

            .invitation {
                max-width: none;
                padding: 0;
            }

            .page {
                width: 100%;
                margin: 0 0 4px;
            }

            .page img {
                width: 100%;
                height: auto;
            }
        }

        @media print {
            @page {
                margin: 0;
                size: auto;
            }

            body {
                background: #ffffff;
            }

            .invitation {
                max-width: none;
                padding: 0;
            }

            .page {
                margin: 0;
                overflow: visible;
                break-after: page;
                page-break-after: always;
            }

            .page:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .image-error {
                display: none !important;
            }
        }
    </style>
</head>

<body>
<main class="invitation">

    <section class="page">
        <img src="./Uma-01.jpg"
             alt="Rangana and Umayangana wedding invitation cover"
             fetchpriority="high"
             loading="eager"
             decoding="async">
        <p class="image-error" hidden></p>
    </section>

    <section class="page">
        <img src="./Uma-02.jpg"
             alt="Wedding invitation message"
             loading="lazy"
             decoding="async">
        <p class="image-error" hidden></p>
    </section>

    <section class="page">
        <img src="./Uma-03.jpg"
             alt="Wedding date, time and venue details"
             loading="lazy"
             decoding="async">
        <p class="image-error" hidden></p>
    </section>

    <section class="page">
        <img src="./Uma-04.jpg"
             alt="Wedding words of blessing"
             loading="lazy"
             decoding="async">
        <p class="image-error" hidden></p>
    </section>

    <section class="page">
        <img src="./Uma-05.jpg"
             alt="Wedding invitation final page"
             loading="lazy"
             decoding="async">
        <p class="image-error" hidden></p>
    </section>

</main>

<script>
    document.querySelectorAll(".page img").forEach(function (img) {
        function showError() {
            const message =
                img.parentElement.querySelector(".image-error");

            message.textContent =
                "Image failed to load: " + img.getAttribute("src");

            const link = document.createElement("a");
            link.href = img.src;
            link.textContent = " Open image directly";
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            message.appendChild(document.createElement("br"));
            message.appendChild(link);

            message.hidden = false;
            img.hidden = true;
        }

        img.addEventListener("error", showError);

        // Handle an image that failed before the event listener was added.
        if (img.complete && img.naturalWidth === 0) {
            showError();
        }
    });
</script>

</body>
</html>
